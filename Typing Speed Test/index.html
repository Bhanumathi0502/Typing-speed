<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Typing Speed Test</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Typing Speed Test</h1>

<p id="sentence">
JavaScript is used to create interactive web pages and web applications.
</p>

<textarea
id="inputText"
placeholder="Start typing here...">
</textarea>

<div class="button-box">

<button class="start-btn"
onclick="startTest()">
Start Test
</button>

<button class="finish-btn"
onclick="checkSpeed()">
Finish Test
</button>

</div>

<h2 id="result"></h2>

</div>

<script src="script.js"></script>

</body>
</html>
